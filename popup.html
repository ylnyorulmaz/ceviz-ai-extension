<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ceviz.ai</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --user-msg-bg: #0284c7;
      --ai-msg-bg: #334155;
    }

    body {
      width: 360px;
      height: 480px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 16px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.1rem;
      margin: 0;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    header .settings-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.2rem;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.2s;
    }

    header .settings-btn:hover {
      color: var(--accent);
    }

    .chat-container {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-msg-bg);
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--ai-msg-bg);
      color: var(--text);
      border-bottom-left-radius: 2px;
    }

    .message.system {
      align-self: center;
      background: rgba(148, 163, 184, 0.15);
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }

    footer {
      padding: 12px;
      background: var(--panel-bg);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button.send-btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      font-weight: bold;
      padding: 0 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    button.send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <h1>🥜 Ceviz.ai</h1>
    <button class="settings-btn" id="open-settings" title="Ayarlar">⚙️</button>
  </header>

  <div class="chat-container" id="chat-box">
    <div class="message system">Ceviz.ai Akıllı Web Asistanınız hazır.</div>
  </div>

  <footer>
    <input type="text" id="user-input" placeholder="Bir şey sorun veya talimat verin..." />
    <button class="send-btn" id="send-btn">Gönder</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
