<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ceviz.ai Side Panel</title>
  
  <!-- KaTeX Math & LaTeX Renderer -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --user-msg-bg: #0284c7;
      --ai-msg-bg: #334155;
      --success: #4ade80;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 14px 18px;
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.15rem;
      margin: 0;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header .header-actions {
      display: flex;
      gap: 4px;
    }

    header .settings-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s, color 0.2s;
    }

    header .settings-btn:hover {
      background: var(--border);
      color: var(--accent);
    }

    .chat-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
    }

    .chat-container.drag-over {
      border: 2px dashed var(--accent);
      background: rgba(56, 189, 248, 0.05);
    }

    .message-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 96%;
    }

    .message-group.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message-group.assistant {
      align-self: flex-start;
      align-items: flex-start;
      width: 100%;
    }

    .message {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.5;
      word-break: break-word;
      overflow-wrap: break-word;
      white-space: pre-wrap;
      max-width: 100%;
      box-sizing: border-box;
    }

    .message.user {
      background: var(--user-msg-bg);
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .message.assistant {
      background: var(--ai-msg-bg);
      color: var(--text);
      border-bottom-left-radius: 2px;
      width: 100%;
    }

    .message.system {
      align-self: center;
      background: rgba(148, 163, 184, 0.12);
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    /* Model & Source Info Badges */
    .badges-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 2px;
    }

    .model-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    /* Code Blocks Container with Horizontal Scroll Protection */
    .code-block-container {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin: 8px 0;
      max-width: 100%;
      overflow-x: auto;
      box-sizing: border-box;
    }

    .code-block-header {
      background: #1e293b;
      padding: 4px 10px;
      font-size: 0.72rem;
      color: var(--accent);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }

    .code-block-content {
      padding: 10px;
      font-family: Consolas, Monaco, 'Andale Mono', monospace;
      font-size: 0.82rem;
      color: #38bdf8;
      white-space: pre;
      overflow-x: auto;
      margin: 0;
    }

    /* Collapsible Details Accordion */
    .details-accordion {
      margin-top: 8px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.6);
      overflow: hidden;
      width: 100%;
      box-sizing: border-box;
    }

    .accordion-toggle {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      padding: 8px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      transition: background 0.2s;
    }

    .accordion-toggle:hover {
      background: rgba(56, 189, 248, 0.2);
    }

    .accordion-content {
      padding: 10px 12px;
      font-size: 0.85rem;
      border-top: 1px solid rgba(56, 189, 248, 0.15);
      display: none;
    }

    .accordion-content.open {
      display: block;
    }

    /* Action Buttons (Copy & TTS) */
    .action-bar {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .action-btn {
      background: rgba(148, 163, 184, 0.12);
      color: var(--muted);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    /* ELA (Explain Like Age) Chips */
    .ela-container {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .ela-title {
      font-size: 0.74rem;
      color: var(--muted);
      font-weight: 600;
    }

    .ela-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .ela-chip {
      background: rgba(56, 189, 248, 0.08);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 14px;
      padding: 4px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }

    .ela-chip:hover {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    /* ELA Rich Components */
    .clarity-container {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.6);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      margin-top: 8px;
      width: 100%;
      box-sizing: border-box;
    }

    .clarity-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
    }

    .clarity-bar-bg {
      flex: 1;
      height: 8px;
      background: #334155;
      border-radius: 4px;
      overflow: hidden;
    }

    .clarity-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #4ade80);
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    .clarity-val {
      font-size: 0.8rem;
      font-weight: 700;
      color: #4ade80;
    }

    .next-steps-box {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .next-steps-label {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 600;
    }

    .next-step-chip {
      background: rgba(74, 222, 128, 0.1);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.25);
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-block;
      margin-right: 6px;
      margin-bottom: 6px;
      transition: all 0.2s;
    }

    .next-step-chip:hover {
      background: #4ade80;
      color: #0f172a;
      border-color: #4ade80;
    }

    /* Quick Action Chips Bar */
    .quick-actions {
      padding: 8px 12px;
      background: var(--panel-bg);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 6px;
      overflow-x: auto;
      flex-shrink: 0;
    }

    .quick-actions::-webkit-scrollbar {
      display: none;
    }

    .quick-btn {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 16px;
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }

    .quick-btn:hover {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    footer {
      padding: 12px 16px;
      background: var(--panel-bg);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 0.92rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button.send-btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      font-weight: 700;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button.send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* KaTeX Custom Styles */
    .katex {
      font-size: 1.05em;
      color: #38bdf8;
    }
    .katex-display {
      margin: 8px 0;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 4px 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>🥜 Ceviz.ai Side Panel</h1>
    <div class="header-actions">
      <button class="settings-btn" id="new-chat-btn" title="Yeni Sohbet">➕</button>
      <button class="settings-btn" id="export-chat-btn" title="Sohbeti İndir (.md)">📥</button>
      <button class="settings-btn" id="open-settings" title="Ayarlar">⚙️</button>
    </div>
  </header>

  <div class="chat-container" id="chat-box">
    <div class="message system">Ceviz.ai Yan Panel Asistanınız hazır.</div>
  </div>

  <!-- Quick Action Chips -->
  <div class="quick-actions" id="quick-actions">
    <button class="quick-btn" data-prompt="bu sayfayı özetle">📝 Sayfayı Özetle</button>
    <button class="quick-btn" data-prompt="bu sayfanın ana fikirlerini çıkar">🔑 Ana Fikirler</button>
    <button class="quick-btn" data-prompt="bu sayfadaki en önemli 3 noktayı maddeler halinde yaz">🎯 3 Önemli Nokta</button>
    <button class="quick-btn" data-prompt="webde ara: dünyada ve türkiyede en son teknoloji haberleri ve gelişmeler">🌐 Web'de Ara</button>
  </div>

  <footer>
    <label for="file-input" class="action-btn" style="padding: 10px; font-size: 1.1rem; cursor: pointer;" title="Dosya / PDF Yükle">📎</label>
    <input type="file" id="file-input" accept=".txt,.md,.pdf,.js,.py,.json,.html,.css,.csv" style="display: none;" />
    <input type="text" id="user-input" placeholder="Bir şey sorun veya dosya sürükleyip bırakın..." />
    <button class="send-btn" id="send-btn">Gönder</button>
  </footer>

  <script src="sidepanel.js"></script>
</body>
</html>
